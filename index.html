        <style>
    :root {
        font-size: 62.5%;
    }

    #voltra-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #voltra-splash.voltra-splash--hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .voltra-mark {
        position: relative;
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .voltra-mark__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(76, 175, 80, 0.25);
        animation: voltra-pulse 1.8s ease-out infinite;
    }

    .voltra-mark__ring--delay {
        animation-delay: 0.6s;
    }

    .voltra-mark__bolt {
        position: relative;
        z-index: 1;
        width: 36px;
        height: 36px;
        fill: #4caf50;
        filter: drop-shadow(0 0 8px rgba(76, 175, 80, 0.6));
    }

    @keyframes voltra-pulse {
        0% {
            transform: scale(0.8);
            opacity: 0.8;
        }
        100% {
            transform: scale(1.8);
            opacity: 0;
        }
    }

    .voltra-wordmark {
        margin-top: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #ffffff;
    }

    .voltra-wordmark__accent {
        color: #4caf50;
    }

     #risk-disclaimer {
        position: fixed;
        bottom: 6rem;
        left: 0;
        right: 0;
        z-index: 7; /* below splash (99999) but above normal content */
        background: #1a1a1a;
        color: #ccc;
        font-size: 11px;
        text-align: center;
        padding: 6px 12px;
        line-height: 1.4;
        border-top: 1px solid #333;
    }

    #risk-disclaimer a {
        color: #4caf50;
        text-decoration: underline;
    }
    /* iOS safe-area handling, matching the pattern used by .control__section */
    @supports (-webkit-touch-callout: none) {
        #risk-disclaimer {
            padding-bottom: calc(6rem + env(safe-area-inset-bottom, 0));
        }
    }
</style>
